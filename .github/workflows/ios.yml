name: ios

# Build the SwiftUI client on a macOS runner and publish an unsigned .ipa.
# No Mac or paid Apple account is needed: sideload the artifact with Sideloadly or
# AltStore (Windows works), which re-sign it with a free Apple ID. See README.md.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch supersedes an in-flight build.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          mkdir -p build
          status=0
          xcodebuild build \
            -project Musik.xcodeproj -scheme Musik -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E '(error:|BUILD SUCCEEDED|BUILD FAILED)' build/xcodebuild.log || true
          exit $status
      - name: Package .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Musik.app build/ipa/Payload/
          cd build/ipa && zip -qry ../Musik-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Musik-unsigned-ipa
          path: build/Musik-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
      # Every build of main (or a vX.Y.Z tag) publishes the .ipa to the release for the
      # app version in project.yml, creating that release and tag on first use.
      - name: Release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*/\1/p' project.yml | head -1)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish to release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: musik iOS ${{ steps.release.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: build/Musik-unsigned.ipa
          make_latest: true
